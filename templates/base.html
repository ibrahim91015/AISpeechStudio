<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#15131b">
  <title>{% block title %}AI Speech Studio{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  {% if mobile_client %}
  <link rel="manifest" href="/speech.webmanifest">
  <link rel="apple-touch-icon" href="/static/speech-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  {% endif %}
  <link rel="stylesheet" href="/static/studio.css?v={{ studio_css_version }}">
  <script defer src="/static/htmx.min.js"></script>
  <script defer src="/static/studio.js?v={{ studio_js_version }}"></script>
  <script defer src="/static/notifications.js?v={{ notifications_js_version }}"></script>
  {% if page == 'library' %}<script defer src="/static/library.js"></script>{% endif %}
</head>
<body data-profile="{{ profile.id }}">
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="top-inner">
    <a class="brand" href="/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 13v6m5-10v14m5-19v24m5-19v14m5-10v6"/></svg>
      <span>AI Speech Studio</span>
    </a>
    <nav aria-label="Primary">
      <a href="/"{% if page == 'studio' %} aria-current="page"{% endif %}>Studio</a>
      <a href="/voices"{% if page == 'voices' %} aria-current="page"{% endif %}>Voices</a>
      <a href="/library"{% if page == 'library' %} aria-current="page"{% endif %}>Library</a>
    </nav>
    <a class="profile" href="/library#profiles" aria-label="Switch profile, current {{ profile.name }}"><span class="avatar">{{ profile.name[:1] }}</span><span>{{ profile.name }}</span></a>
  </div>
</header>
<aside class="system-stats" aria-label="Live server usage" id="system-stats" hidden>
  <dl class="stats-inner">
    <div><dt>GPU</dt><dd data-stat="gpu">—</dd></div>
    <div><dt>VRAM</dt><dd data-stat="vram">—</dd></div>
    <div><dt>CPU</dt><dd data-stat="cpu">—</dd></div>
    <div><dt>RAM</dt><dd data-stat="ram">—</dd></div>
  </dl>
</aside>
<main class="main" id="main">{% block body %}{% endblock %}</main>
</body>
</html>
