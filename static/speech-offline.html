<title>Studio unavailable</title>
<style>
  :root { background: #15131b; color: #f3edf8; font: 1rem/1.55 system-ui,sans-serif; }
  body { min-height: 100svh; margin: 0; display: grid; place-items: center; }
  main { box-sizing: border-box; width: min(100%,450px); padding: 32px 26px; }
  svg { width: 50px; height: 50px; }
  h1 { margin: 16px 0 10px; font-size: clamp(1.75rem, 7vw, 2.4rem); line-height: 1.15; letter-spacing: -.03em; }
  p { margin: 0 0 22px; color: #c7bdd3; }
  a { display: inline-block; padding: 10px 20px; color: #32204a; background: #dfc7ff; text-decoration: none; font-weight: 650; border-radius: 24px; }
  a:focus-visible { outline: 2px solid #dfc7ff; outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="#443350"/><path d="M6 13v6m5-10v14m5-19v24m5-19v14m5-10v6" fill="none" stroke="#e0c5ff" stroke-linecap="round" stroke-width="2"/></svg>
  <h1>Can’t connect to Speech Studio</h1>

  <a href="/?app=1">Try again</a>
